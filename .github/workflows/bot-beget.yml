name: Бот на Бегет

# Сам доставляет новую версию бота на Бегет (папка ~/energy-bot), когда меняется код бота.
# Заменяет только bot.mjs, zapusk.sh, fonts/, node_modules/ и versiya.txt.
# НИКОГДА не трогает nastroyki.env (токен и фраза), data/ (подписчики), log.txt и node/ (свой Node.js).
# Нужен секрет репозитория BEGET_SSH_KEY: ОГРАНИЧЕННЫЙ ключ, созданный на Бегете файлом beget/ustanovit-klyuch.sh.
# Он не даёт входа в аккаунт: только передачу архива приёмнику beget/priem.sh.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'beget/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bot-beget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-beget
  cancel-in-progress: false

env:
  BEGET_HOST: ${{ vars.BEGET_HOST || 'hochuofu.beget.tech' }}
  BEGET_USER: ${{ vars.BEGET_USER || 'hochuofu' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Собрать бота
        run: bash beget/sobrat.sh
      - name: Проверить ключ
        id: key
        env:
          KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning title=Нет ключа Бегета::Секрет BEGET_SSH_KEY не добавлен — бот собран и проверен, но на Бегет не отправлен."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/beget && chmod 600 ~/.ssh/beget
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Отправить на Бегет
        if: steps.key.outputs.ok == 'yes'
        # Ключ ограничен на стороне Бегета: он может только передать архив приёмнику
        # ~/.energy-bot-priem/priem.sh (beget/priem.sh). Тот сам проверяет архив и кладёт файлы в ~/energy-bot.
        run: |
          for h in $BEGET_HOST kryton.beget.com; do
            echo "Пробую $h"
            ssh-keyscan -T 20 "$h" >> ~/.ssh/known_hosts 2>/dev/null || continue
            if tar -czf - -C dist-bot/energy-bot . | ssh -i "$HOME/.ssh/beget" -o BatchMode=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes "$BEGET_USER@$h"; then
              exit 0
            fi
          done
          echo "::error title=Бегет не принял обновление::Подробности — в строках выше."
          exit 1
      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/beget
