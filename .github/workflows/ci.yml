name: Тесты и публикация
on:
  
push:
    
branches: [main]
  
pull_request:
  
workflow_dispatch:
permissions:
  
contents: read
  
pages: write
  
id-token: write
concurrency:
  
group: pages
  
cancel-in-progress: false
jobs:
  
test:
    
runs-on: ubuntu-latest
    
steps:
      - 
uses: actions/checkout@v4
      - 
uses: actions/setup-node@v4
        
with:
          
node-version: 22
          
cache: npm
      - 
run: npm ci
      - 
run: npm run typecheck
      - 
run: npm test
  
deploy:
    
if: github.event_name != 'pull_request'
    
needs: test
    
runs-on: ubuntu-latest
    
environment:
      
name: github-pages
      
url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    
steps:
      - 
uses: actions/checkout@v4
      - 
uses: actions/setup-node@v4
        
with:
          
node-version: 22
          
cache: npm
      - 
run: npm ci
      - 
run: npm run build
        
env:
          
BASE: /${{ github.event.repository.name }}/
      - 
uses: actions/upload-pages-artifact@v3
        
with:
          
path: dist
      
# GitHub иногда не сразу «видит» только что загруженный архив сайта
      
# («No artifacts named github-pages»). Тогда ждём и пробуем ещё раз.
      - 
id: deployment
        
continue-on-error: true
        
uses: actions/deploy-pages@v4
      - 
if: steps.deployment.outcome == 'failure'
        
run: sleep 30
      - 
id: retry1
        
if: steps.deployment.outcome == 'failure'
        
continue-on-error: true
        
uses: actions/deploy-pages@v4
      - 
if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        
run: sleep 90
      - 
id: retry2
        
if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        
uses: actions/deploy-pages@v4
